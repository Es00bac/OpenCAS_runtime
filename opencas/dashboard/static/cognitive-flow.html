<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCAS Cognitive Flow</title>
  <link rel="stylesheet" href="css/app.css?v=10" />
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(1300px 700px at 12% -12%, #162238 0%, #07121f 52%, #050c16 100%);
      color: #e2e8f0;
      font: 13px/1.45 'JetBrains Mono', 'IBM Plex Mono', monospace;
    }

    .popout-root {
      min-height: 100%;
      display: grid;
      gap: 10px;
      grid-template-rows: auto 1fr;
      padding: 12px;
      box-sizing: border-box;
    }

    .flow-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-end;
      border-bottom: 1px solid rgba(0, 229, 255, 0.12);
      padding-bottom: 10px;
    }

    .flow-field {
      display: grid;
      gap: 6px;
      min-width: 140px;
      color: #94a3b8;
    }

    .flow-field input,
    .flow-field select,
    .flow-toolbar .btn {
      height: 30px;
      border-radius: 8px;
    }

    .flow-field input,
    .flow-field select {
      border: 1px solid rgba(148, 163, 184, 0.26);
      background: rgba(2, 6, 12, 0.65);
      color: #e2e8f0;
      padding: 6px 8px;
    }

    .flow-toolbar .btn {
      border: 1px solid rgba(56, 189, 248, 0.26);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      padding: 6px 12px;
      cursor: pointer;
    }

    .flow-toolbar .btn:hover {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.12);
    }

    .flow-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
      gap: 12px;
      min-height: 0;
      min-height: calc(100vh - 128px);
    }

    .flow-canvas-wrap {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(0, 229, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .flow-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 128px);
      display: block;
    }

    .flow-detail-wrap {
      display: grid;
      min-height: 0;
      overflow: auto;
    }

    .flow-detail-wrap .data-table {
      margin-top: 8px;
    }

    .flow-detail-wrap .helper-text,
    .flow-detail-wrap .muted {
      color: #94a3b8;
    }

    .muted.small {
      font-size: 11px;
    }

    .flow-status {
      margin-left: 8px;
      font-size: 12px;
      color: #cbd5e1;
      min-width: 260px;
    }

    .flow-selected-wrap {
      display: grid;
      gap: 8px;
    }

    @media (max-width: 1220px) {
      .flow-main {
        grid-template-columns: 1fr;
      }

      .flow-detail-wrap {
        max-height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="popout-root">
    <div class="flow-toolbar">
      <div class="flow-field">
        <label>Window seconds</label>
        <input id="windowSeconds" type="number" min="5" max="7200" step="1" value="180" />
      </div>
      <div class="flow-field">
        <label>Event limit</label>
        <input id="eventLimit" type="number" min="20" max="600" step="10" value="180" />
      </div>
      <div class="flow-field">
        <label>Session</label>
        <input id="sessionFilter" type="text" placeholder="optional session" />
      </div>
      <div class="flow-field">
        <label>Kind filter</label>
        <input id="kindFilter" type="text" placeholder="span_start,llm_call" />
      </div>
      <div class="flow-field">
        <label>Flow detail</label>
        <select id="includeNoise">
          <option value="false">signal focus</option>
          <option value="true">all telemetry</option>
        </select>
      </div>
      <div class="flow-field">
        <label>Sequential links</label>
        <select id="showSequential">
          <option value="true">enabled</option>
          <option value="false">disabled</option>
        </select>
      </div>
      <div class="flow-field">
        <label>Span hierarchy</label>
        <select id="showSpanFlow">
          <option value="true">enabled</option>
          <option value="false">disabled</option>
        </select>
      </div>
      <div>
        <button class="btn" id="apply">Apply &amp; refresh</button>
      </div>
      <span class="flow-status" id="flowStatus">Waiting</span>
    </div>

    <div class="flow-main">
      <div class="flow-canvas-wrap">
        <canvas id="flowCanvas"></canvas>
      </div>
      <aside class="panel flow-detail-wrap">
        <h4 class="mt-0">Selection</h4>
        <div class="flow-selected-wrap" id="flowSelection"></div>
        <h4>Readable thought ledger</h4>
        <div class="flow-selected-wrap" id="flowLedger"></div>
      </aside>
    </div>
  </div>

  <script>
    const state = {
      data: { nodes: [], edges: [] },
      selectedEventId: '',
      timer: null,
    };

    function parseBool(value, fallback = true) {
      if (typeof value !== 'string') return fallback;
      const lowered = value.toLowerCase();
      if (lowered === 'false') return false;
      if (lowered === 'true') return true;
      return fallback;
    }

    function readControls() {
      const params = new URLSearchParams(window.location.search);
      const windowSeconds = Number(params.get('window_seconds') || document.getElementById('windowSeconds').value || 180);
      const limit = Number(params.get('limit') || document.getElementById('eventLimit').value || 180);
      const sessionId = params.get('session_id') || document.getElementById('sessionFilter').value || '';
      const kindFilter = params.get('kind_filter') || document.getElementById('kindFilter').value || '';
      const includeNoise = params.has('include_noise')
        ? parseBool(params.get('include_noise'), false)
        : parseBool(document.getElementById('includeNoise').value, false);
      const showSequential = params.has('show_sequential_links')
        ? parseBool(params.get('show_sequential_links'), true)
        : parseBool(document.getElementById('showSequential').value, true);
      const showSpanFlow = params.has('show_span_flow')
        ? parseBool(params.get('show_span_flow'), true)
        : parseBool(document.getElementById('showSpanFlow').value, true);

      document.getElementById('windowSeconds').value = String(Math.max(5, Number.isFinite(windowSeconds) ? Math.floor(windowSeconds) : 180));
      document.getElementById('eventLimit').value = String(Math.max(20, Math.min(600, Math.floor(Number.isFinite(limit) ? limit : 180))));
      document.getElementById('sessionFilter').value = sessionId;
      document.getElementById('kindFilter').value = kindFilter;
      document.getElementById('includeNoise').value = includeNoise ? 'true' : 'false';
      document.getElementById('showSequential').value = showSequential ? 'true' : 'false';
      document.getElementById('showSpanFlow').value = showSpanFlow ? 'true' : 'false';

      const selectedEventId = params.get('selected_event_id') || '';
      return {
        window_seconds: Math.max(5, Number.isFinite(windowSeconds) ? Math.floor(windowSeconds) : 180),
        limit: Math.max(20, Math.min(600, Math.floor(Number.isFinite(limit) ? limit : 180))),
        session_id: sessionId,
        kind_filter: kindFilter,
        include_noise: includeNoise,
        show_sequential_links: showSequential,
        show_span_flow: showSpanFlow,
        selected_event_id: selectedEventId,
      };
    }

    function escapeHtml(t) {
      return String(t).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        '\'': '&#39;',
      })[m]);
    }

    function formatDateTime(value) {
      if (value === null || value === undefined || value === '') return '-';
      const date = new Date(typeof value === 'number' ? value * 1000 : value);
      if (Number.isNaN(date.getTime())) return escapeHtml(String(value));
      return date.toLocaleString();
    }

    function colorForKind(node) {
      const kind = node.kind || 'telemetry';
      const palette = {
        span_start: '#38bdf8',
        span_end: '#f59e0b',
        llm_call: '#f97316',
        tool_call: '#22c55e',
        memory_noted: '#e879f9',
        memory_activated: '#f59e0b',
        memory_compact: '#facc15',
        memory_write: '#a78bfa',
        action_backlink: '#ef4444',
        consolidation_run: '#fb7185',
        turn: '#34d399',
        warning: '#fcd34d',
        error: '#fb7185',
        flow_order: '#22d3ee',
        span_hierarchy: '#94a3b8',
        continuity_backlink: '#f59e0b',
      };
      return palette[kind] || '#94a3b8';
    }

    function edgeColor(kind) {
      const palette = {
        flow_order: 'rgba(56, 189, 248, 0.5)',
        lane_order: 'rgba(34, 211, 238, 0.28)',
        cognitive_sequence: 'rgba(248, 250, 252, 0.42)',
        span_hierarchy: 'rgba(168, 85, 247, 0.45)',
        continuity_backlink: 'rgba(34, 211, 238, 0.6)',
        action_backlink: 'rgba(248, 113, 113, 0.55)',
        default: 'rgba(148, 163, 184, 0.35)',
      };
      return palette[kind] || palette.default;
    }

    function radiusForNode(node) {
      if (node.noted_as_such) return 7;
      if (node.is_span_gate) return 8;
      return 5;
    }

    function findFlowNode(nodeId) {
      return (state.data?.nodes || []).find(item => (item.event_id || item.node_id) === nodeId) || null;
    }

    function flowCandidates(node) {
      const candidates = [];
      const seen = new Set();
      const add = (nodeId, source) => {
        if (!nodeId) return;
        const normalized = String(nodeId);
        if (!normalized || seen.has(normalized)) return;
        seen.add(normalized);
        candidates.push({ node_id: normalized, source: source || 'linked' });
      };
      if (!node) return candidates;
      add(node.node_ref, 'node_ref');
      if (node.source_type && node.source_id) add(`${node.source_type}:${node.source_id}`, 'source');
      add(node.event_payload?.memory_event_id, 'event_payload.memory_event_id');
      const payload = node.event_payload?.payload || {};
      if (typeof payload === 'object' && payload !== null) {
        add(payload.node_id, 'payload.node_id');
        if (payload.episode_id) add(`episode:${payload.episode_id}`, 'payload.episode_id');
        if (payload.memory_event_id) add(`memory:${payload.memory_event_id}`, 'payload.memory_event_id');
      }
      return candidates;
    }

    function renderFlowCanvas() {
      const canvas = document.getElementById('flowCanvas');
      if (!canvas) return;
      const rawNodes = (state.data.nodes || []).map(item => ({
        ...item,
        timestampMs: Date.parse(item.timestamp || ''),
      })).filter(item => Number.isFinite(item.timestampMs)).sort((a, b) => a.timestampMs - b.timestampMs);
      const edges = (state.data.edges || []);

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);

      if (!rawNodes.length) {
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('No cognitive-flow events in the selected window.', 12, 22);
        renderFlowDetails();
        return;
      }

      const times = rawNodes.map(item => item.timestampMs);
      const minTime = Math.min(...times);
      const maxTime = Math.max(...times);
      const spreadMs = Math.max(1, maxTime - minTime);
      const plotLeft = 72;
      const plotRight = rect.width - 20;
      const plotTop = 24;
      const plotBottom = rect.height - 42;
      const laneSet = new Map();

      rawNodes.forEach(node => {
        const lane = node.flow_lane || node.lane_label || node.subsystem || `Lane ${Number(node.span_depth || 0)}`;
        const list = laneSet.get(lane) || [];
        list.push(node);
        laneSet.set(lane, list);
      });
      const sortedLanes = Array.from(laneSet.keys()).sort((a, b) => {
        const first = laneSet.get(a)?.[0];
        const second = laneSet.get(b)?.[0];
        return Number(first?.lane_index ?? first?.span_depth ?? 0) - Number(second?.lane_index ?? second?.span_depth ?? 0);
      });
      const laneHeight = Math.max(40, Math.floor((rect.height - 100) / (sortedLanes.length || 1)));
      const laneMap = new Map();
      sortedLanes.forEach((lane, index) => {
        laneMap.set(lane, plotBottom - (index + 0.5) * laneHeight);
      });

      const laneCounter = {};
      const positioned = rawNodes.map(node => {
        const lane = node.flow_lane || node.lane_label || node.subsystem || `Lane ${Number(node.span_depth || 0)}`;
        const baseY = laneMap.get(lane) || (plotBottom - 20);
        const serial = laneCounter[lane] ? laneCounter[lane] + 1 : 0;
        laneCounter[lane] = serial;
        const offset = ((serial % 4) - 1.5) * 10;
        const x = plotLeft + ((node.timestampMs - minTime) / spreadMs) * (plotRight - plotLeft);
        return {
          ...node,
          x,
          y: baseY + offset,
        };
      });
      const nodeById = new Map(positioned.map(item => [item.event_id || item.node_id, item]));

      ctx.strokeStyle = 'rgba(0, 229, 255, 0.12)';
      ctx.lineWidth = 1;
      sortedLanes.forEach(lane => {
        const y = laneMap.get(lane) || plotBottom;
        ctx.beginPath();
        ctx.moveTo(plotLeft, y);
        ctx.lineTo(plotRight, y);
        ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(String(lane).substring(0, 24), 16, y + 4);
      });

      edges.forEach(edge => {
        const source = nodeById.get(edge.source_node_id);
        const target = nodeById.get(edge.target_node_id);
        if (!source || !target) return;
        const width = 1.2 + Math.max(0.4, Number(edge.strength || 0.35) * 2.1);
        ctx.beginPath();
        ctx.strokeStyle = edgeColor(edge.kind || '');
        ctx.lineWidth = width;
        ctx.moveTo(source.x, source.y);
        ctx.bezierCurveTo((source.x + target.x) / 2, source.y, (source.x + target.x) / 2, target.y, target.x, target.y);
        ctx.stroke();
      });

      positioned.forEach(point => {
        const r = radiusForNode(point);
        const isSelected = state.selectedEventId === (point.event_id || point.node_id);
        ctx.beginPath();
        ctx.fillStyle = colorForKind(point);
        ctx.strokeStyle = isSelected ? '#f8fafc' : (point.is_span_gate ? '#facc15' : 'rgba(8, 18, 31, 0.85)');
        ctx.lineWidth = isSelected ? 2.5 : (point.is_span_gate ? 2 : 1);
        ctx.arc(point.x, point.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        const shortLabel = (point.label || point.kind || 'event').substring(0, 24);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(shortLabel, point.x + 8, point.y - 8);
      });

      const status = state.data?.stats || {};
      document.getElementById('flowStatus').textContent =
        `events ${state.data.nodes.length} • edges ${status.edge_count || (state.data.edges || []).length || 0} • thoughts ${status.readable_thought_count ?? status.high_signal_event_count ?? 0} • missing time ${(status.temporal_missing_node_count || 0) + (status.temporal_missing_edge_count || 0)} • last update ${new Date().toLocaleTimeString()}`;
      renderFlowDetails();
      renderFlowLedger();

      canvas.onclick = (evt) => {
        const rect = canvas.getBoundingClientRect();
        const x = evt.clientX - rect.left;
        const y = evt.clientY - rect.top;
        let best = null;
        let bestDist = Infinity;
        positioned.forEach(point => {
          const d = Math.hypot(point.x - x, point.y - y);
          if (d <= (radiusForNode(point) + 8) && d < bestDist) {
            bestDist = d;
            best = point;
          }
        });
        if (best) {
          state.selectedEventId = best.event_id || best.node_id || '';
          renderFlowCanvas();
          renderFlowDetails();
        }
      };
    }

    function renderFlowDetails() {
      const details = document.getElementById('flowSelection');
      if (!details) return;
      const node = findFlowNode(state.selectedEventId);
      if (!node) {
        details.innerHTML = '<p class="muted">No selected event. Click a node in the canvas.</p>';
        return;
      }
      const eventId = node.event_id || node.node_id || '';
      const edges = state.data?.edges || [];
      const byId = new Map((state.data?.nodes || []).map(item => [item.event_id || item.node_id, item]));
      const incoming = edges
        .filter(edge => edge.target_node_id === eventId)
        .map(edge => ({
          edge,
          sourceId: edge.source_node_id,
          sourceNode: byId.get(edge.source_node_id),
        }))
        .slice(0, 10);
      const outgoing = edges
        .filter(edge => edge.source_node_id === eventId)
        .map(edge => ({
          edge,
          targetId: edge.target_node_id,
          targetNode: byId.get(edge.target_node_id),
        }))
        .slice(0, 10);
      const payload = node.event_payload || {};

      let html = '<div class="stack">';
      const isDecisionSignal = Boolean(node.decision_signal);
      html += `<div class="pill-row">
        <span class="badge">${escapeHtml(node.subsystem || 'system')}</span>
        <span class="badge">${escapeHtml(node.kind || 'event')}</span>
        <span class="badge">${escapeHtml(node.pipeline_stage || 'processing')}</span>
        ${node.is_span_gate ? '<span class="badge warn">span gate</span>' : ''}
        ${isDecisionSignal ? '<span class="badge warn">decision signal</span>' : ''}
      </div>`;
      html += `<p class="muted">Time: ${formatDateTime(node.timestamp)} • Event: ${escapeHtml(eventId)}</p>`;
      html += `<p class="muted">Span: ${escapeHtml(node.span_id || '-')} • Parent: ${escapeHtml(node.parent_span_id || '-')}</p>`;
      html += `<p class="muted">Source: ${escapeHtml(node.source_type || 'telemetry')} / ${escapeHtml(node.source_id || '-')} • ${escapeHtml(node.activation_source || '-')}</p>`;
      if (node.source_label) {
        html += `<p class="muted">Source label: ${escapeHtml(node.source_label)}</p>`;
      }
      if (node.label) {
        html += `<p><strong>${escapeHtml(node.label)}</strong></p>`;
      }
      if (node.message) html += `<p class="muted">Message: ${escapeHtml(node.message)}</p>`;
      if (node.event_message) html += `<p class="muted">Event message: ${escapeHtml(node.event_message)}</p>`;
      if (node.thought_text) {
        html += `<h5 class="mt-3">Observable thought</h5><p>${escapeHtml(node.thought_text)}</p>`;
      }
      if (node.reasoning_text) {
        html += `<h5 class="mt-3">Reasoning evidence</h5><p>${escapeHtml(node.reasoning_text)}</p>`;
      }
      if (node.evidence_text) {
        html += `<h5 class="mt-3">Referenced evidence</h5><p>${escapeHtml(node.evidence_text)}</p>`;
      }

      const candidates = flowCandidates(node);
      if (candidates.length) {
        html += '<h5 class="mt-3">Linked memory refs</h5><div class="pill-row">';
        candidates.forEach(item => {
          html += `<span class="badge" title="${escapeHtml(item.source)}">${escapeHtml(item.node_id)}</span>`;
          if (window.opener && !window.opener.closed && window.opener.__openCASMemoryApp?.openAtlasNodeFromFlow) {
            html += `<button class="btn-link" onclick="focusAtlasFromPopout('${escapeHtml(item.node_id)}')">focus atlas</button>`;
          }
        });
        html += '</div>';
      }

      html += '<h5 class="mt-4">Payload</h5>';
      if (Object.keys(payload).length) {
        html += `<pre class="json">${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
      } else {
        html += '<p class="muted">No payload available.</p>';
      }

      if (incoming.length || outgoing.length) {
        html += '<h5 class="mt-4">Connected flow edges</h5>';
        html += '<table class="data-table"><thead><tr><th>Dir</th><th>Event</th><th>Kind</th><th>Strength</th><th>Action</th></tr></thead><tbody>';
        incoming.forEach(item => {
          const label = item.sourceNode?.label || item.sourceNode?.kind || item.sourceId || '-';
          html += `<tr>
            <td>in</td>
            <td>${escapeHtml(label)}</td>
            <td>${escapeHtml(item.edge.kind || '-')}</td>
            <td>${escapeHtml(String(item.edge.strength ?? '-'))}</td>
            <td><button class="btn-link" onclick="selectFlowEvent('${escapeHtml(item.sourceId || '')}')">focus</button></td>
          </tr>`;
        });
        outgoing.forEach(item => {
          const label = item.targetNode?.label || item.targetNode?.kind || item.targetId || '-';
          html += `<tr>
            <td>out</td>
            <td>${escapeHtml(label)}</td>
            <td>${escapeHtml(item.edge.kind || '-')}</td>
            <td>${escapeHtml(String(item.edge.strength ?? '-'))}</td>
            <td><button class="btn-link" onclick="selectFlowEvent('${escapeHtml(item.targetId || '')}')">focus</button></td>
          </tr>`;
        });
        html += '</tbody></table>';
      }

      if (node.continuity_backlink) {
        html += `<p class="muted small mt-2">Continuity backlink: ${escapeHtml(node.continuity_backlink)}</p>`;
      }
      if (node.noted_as_such) {
        html += '<p class="muted small mt-2">Marked as notable.</p>';
      }
      html += '</div>';
      details.innerHTML = html;
    }

    function renderFlowLedger() {
      const target = document.getElementById('flowLedger');
      if (!target) return;
      const stats = state.data?.stats || {};
      let ledger = Array.isArray(stats.recent_readable_thoughts) ? stats.recent_readable_thoughts : [];
      if (!ledger.length) {
        ledger = (state.data?.nodes || [])
          .filter(item => !item.is_noise && Number(item.flow_priority || 0) >= 0.25 && item.thought_text)
          .slice(-8);
      }
      if (!ledger.length) {
        target.innerHTML = '<p class="muted">No readable thought records in this window.</p>';
        return;
      }
      let html = '<div class="stack">';
      ledger.slice(-8).forEach(item => {
        const eventId = item.event_id || item.node_id || '';
        html += `<button class="activity-chip" onclick="selectFlowEvent('${escapeHtml(eventId)}')">
          <span class="activity-dot" style="--pulse:50%"></span>
          <span>
            <strong>${escapeHtml(item.flow_lane || item.subsystem || item.kind || 'event')} ${escapeHtml(String(item.temporal_order_label || item.sequence_index || ''))}</strong>
            <small>${escapeHtml(item.thought_text || '')}</small>
            ${item.reasoning_text ? `<em>${escapeHtml(item.reasoning_text)}</em>` : ''}
          </span>
        </button>`;
      });
      html += '</div>';
      target.innerHTML = html;
    }

    function focusAtlasFromPopout(nodeRef) {
      if (!window.opener || window.opener.closed) return;
      const app = window.opener.__openCASMemoryApp;
      if (!app || typeof app.openAtlasNodeFromFlow !== 'function') return;
      app.openAtlasNodeFromFlow(nodeRef);
      app.cognitiveFlowMode = 'projection';
      app.renderLandscapeChart();
      if (app.selectNodeById) app.selectNodeById(nodeRef);
      window.opener.focus();
    }

    function selectFlowEvent(eventId) {
      state.selectedEventId = eventId || '';
      renderFlowCanvas();
      renderFlowLedger();
    }

    async function refreshFlow() {
      const parsed = readControls();
      const query = new URLSearchParams();
      query.set('window_seconds', String(parsed.window_seconds));
      query.set('limit', String(parsed.limit));
      query.set('include_noise', String(parsed.include_noise));
      query.set('show_span_flow', String(parsed.show_span_flow));
      query.set('show_sequential_links', String(parsed.show_sequential_links));
      if (parsed.session_id) query.set('session_id', parsed.session_id);
      if (parsed.kind_filter) query.set('kind_filter', parsed.kind_filter);
      if (state.selectedEventId) query.set('selected_event_id', state.selectedEventId);

      try {
        const response = await fetch(`/api/memory/cognitive-flow?${query.toString()}`);
        if (!response.ok) {
          document.getElementById('flowStatus').textContent = `Failed to load (${response.status})`;
          return;
        }
        state.data = await response.json();
        const nodes = state.data?.nodes || [];
        const keep = nodes.some(item => item.event_id === state.selectedEventId);
        if (!state.selectedEventId || !keep) {
          state.selectedEventId = nodes.length ? nodes[nodes.length - 1].event_id : '';
        }
        renderFlowCanvas();
      } catch (e) {
        document.getElementById('flowStatus').textContent = 'Failed to refresh data';
      }
    }

    document.getElementById('apply').addEventListener('click', refreshFlow);

    window.addEventListener('resize', () => {
      clearTimeout(window.__flowResizeDebounce);
      window.__flowResizeDebounce = setTimeout(renderFlowCanvas, 120);
    });

    function start() {
      const parsed = readControls();
      if (parsed.selected_event_id) {
        state.selectedEventId = parsed.selected_event_id;
      }
      refreshFlow();
      if (state.timer) clearInterval(state.timer);
      state.timer = setInterval(refreshFlow, 3000);
    }

    start();
  </script>
</body>
</html>
