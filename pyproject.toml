[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"
include = [
    "opencas/*.py",
    "opencas/**/*.py",
    "scripts/*.py",
    "scripts/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
]
exclude = [
    ".venv",
    "venv",
    "workspace",
    "archive",
    ".tox",
    ".ruff_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "I001"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402", "E702", "E722", "E731", "E741", "F841"]
"tests/**/*.py" = ["E402", "E731", "E741", "F841"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
